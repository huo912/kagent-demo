# kagent BYO Agent 部署清单
# 适用 kagent API 版本: kagent.dev/v1alpha2
#
# 使用方式:
#   1. 修改 byo.deployment.image 为你的镜像地址
#   2. kubectl apply -f agent.yaml
#   3. kagent 控制器自动创建 Deployment 与 Service,
#      并向 Pod 注入 KAGENT_URL / KAGENT_NAME / KAGENT_NAMESPACE 环境变量。
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: basic-agent
  # 如需要,可指定命名空间
  # namespace: kagent
spec:
  description: A minimal Python agent (BYO) with a calculator tool, deployable with KAgent
  type: BYO
  byo:
    deployment:
      # 替换为你的镜像仓库地址,例如 ghcr.io/your-org/kagent-demo-basic-agent:0.1.0
      image: localhost:5001/kagent-demo-basic-agent:latest
      # 如有需要可自定义 Deployment 副本数等字段,例如:
      # replicas: 1
      env:
        # Agent 处理消息时需要调用 LLM,必须注入 API Key。
        # 请先在集群中创建该 Secret:
        #   kubectl create secret generic kagent-openai \
        #     --from-literal=OPENAI_API_KEY=<your-key>
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kagent-openai
              key: OPENAI_API_KEY
        # LLM 的 base_url(可选)。设置后 kagent 会自动创建指向该地址的
        # OpenAI 客户端并切换为 chat_completions 模式,兼容 OpenAI 兼容网关
        # (Azure AI Foundry / LiteLLM / vLLM / Ollama 等)。
        # 不设置则默认走 https://api.openai.com。
        # - name: OPENAI_API_BASE
        #   value: "http://your-llm-gateway/v1"
